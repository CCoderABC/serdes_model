[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "serdes-model"
version = "0.1.0"
description = "Behavioral models for long-range ADC-based SerDes links"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "reedsolo>=1.7.0",
    "scikit-rf>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
